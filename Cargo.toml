[package]
name = "selfloom"
version = "0.1.0"
edition = "2021"
authors = ["Vivek Reddy <vivekreddy01037@gmail.com>"]
license = "MIT"
description = "Local-first MCP memory layer. Markdown + git. Zero cloud."
repository = "https://github.com/vvvvvivekkk/selfloom"
readme = "README.md"
keywords = ["mcp", "memory", "claude", "local-first", "markdown"]
categories = ["command-line-utilities"]

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
dirs = "5.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
